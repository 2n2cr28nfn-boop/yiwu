  .header { background: linear-gradient(135deg, #6366F1 0%, #38BDF8 100%); color: #fff; padding: 28px 36px; border-radius: 14px; margin-bottom: 26px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .header-left h1 { font-size: 32px; font-weight: 900; letter-spacing: 1px; margin-bottom: 4px; }
  .header-left .tagline { font-size: 12px; opacity: 0.92; letter-spacing: 0.5px; }
  .header-right { text-align: left; }
  .header-right .doc-label { font-size: 11px; opacity: 0.85; margin-bottom: 3px; }
  .header-right .doc-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .header-right .doc-num { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 700; display: inline-block; }

  /* ──── معلومات ──── */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
  .info-box { padding: 16px 18px; background: #F8FAFC; border: 1px solid #E5E7EB; border-radius: 10px; }
  .info-box .label { font-size: 10px; color: #6B7280; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-box .val { font-size: 14px; font-weight: 800; color: #111827; }
  .info-box .sub { font-size: 11px; color: #6B7280; margin-top: 3px; }

  /* ──── جدول ──── */
  table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  thead { background: #1F2937; color: #fff; }
  thead th { padding: 11px 8px; font-size: 11px; font-weight: 700; text-align: center; letter-spacing: 0.3px; }
  tbody tr { border-bottom: 1px solid #E5E7EB; }
  tbody tr:nth-child(even) { background: #F9FAFB; }

  /* ──── الإجمالي ──── */
  .totals { display: grid; grid-template-columns: 1fr 280px; gap: 20px; margin-bottom: 24px; }
  .totals-summary { padding: 16px; background: linear-gradient(135deg, #FEF3C7, #FDE68A); border-radius: 10px; border: 1px solid #F59E0B; }
  .totals-summary .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; }
  .totals-summary .row.grand { border-top: 2px solid #92400E; margin-top: 6px; padding-top: 9px; font-size: 16px; font-weight: 900; color: #92400E; }

  /* ──── شروط ──── */
  .terms { padding: 18px 20px; background: #F8FAFC; border-right: 4px solid #6366F1; border-radius: 8px; margin-bottom: 18px; }
  .terms .title { font-size: 13px; font-weight: 800; color: #4338CA; margin-bottom: 10px; }
  .terms ul { padding-right: 18px; }
  .terms li { font-size: 11px; color: #4B5563; margin-bottom: 5px; line-height: 1.6; }

  /* ──── توقيع ──── */
  .footer { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
  .sig { text-align: center; padding-top: 35px; border-top: 1px solid #9CA3AF; }
  .sig .sig-label { font-size: 11px; color: #6B7280; margin-bottom: 3px; }
  .sig .sig-name { font-size: 12px; font-weight: 800; color: #111827; }
